[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeonmind-agent"
version = "0.1.0"
description = "Bounded external agent runtime for DungeonMind"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langgraph==1.2.10",
    "langchain==1.3.14",
    "langgraph-checkpoint-sqlite==3.1.0",
    "pydantic==2.13.4",
]

[tool.setuptools.packages.find]
include = ["dungeonmind_agent*"]
